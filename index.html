<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icone-app.svg" />
    <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Milebag — da esteira do aeroporto à porta do passageiro</title>
    <meta
      name="description"
      content="O Milebag liga a companhia aérea que encontra a bagagem extraviada à empresa que a entrega: registro, encaminhamento, rota, comprovante e fechamento. Peça uma demonstração."
    />
    <link rel="canonical" href="https://www.milebag.com.br/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Milebag" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://www.milebag.com.br/" />
    <meta property="og:title" content="Milebag — da esteira do aeroporto à porta do passageiro" />
    <meta
      property="og:description"
      content="Bagagem extraviada, do achado à entrega: a companhia aérea registra e encaminha, a empresa de entrega leva até a porta."
    />
    <meta property="og:image" content="https://www.milebag.com.br/institucional/og-milebag.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Aplica o tema antes da primeira pintura (sem piscar o claro para quem usa escuro).
      // Mesma regra e mesma chave de src/shared/utils/preferencias.ts, que assume depois do carregamento.
      try {
        var tema = localStorage.getItem("milebag_tema");
        var escuro = tema === "escuro" || (tema !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.tema = escuro ? "escuro" : "claro";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
