<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f3f1eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1730" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Milebag — software de gestão e logística de bagagens extraviadas</title>
    <meta
      name="description"
      content="Software de gestão e logística de bagagens extraviadas: painel web para companhias aéreas e empresas de entrega, aplicativo do motorista e rastreio para o passageiro. Registro, rota, comprovante e fechamento. Peça uma demonstração."
    />
    <link rel="canonical" href="https://www.milebag.com.br/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Milebag" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://www.milebag.com.br/" />
    <meta property="og:title" content="Milebag — software de gestão e logística de bagagens extraviadas" />
    <meta
      property="og:description"
      content="Painel web e aplicativo que ligam a companhia aérea à empresa que entrega a bagagem extraviada, da esteira à porta do passageiro."
    />
    <meta property="og:image" content="https://www.milebag.com.br/institucional/og-milebag.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Aplica o tema antes da primeira pintura (sem piscar o claro para quem usa escuro).
      // Mesma regra e mesma chave de src/shared/utils/preferencias.ts, que assume depois do carregamento.
      try {
        var tema = localStorage.getItem("milebag_tema");
        var escuro = tema === "escuro" || (tema !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.tema = escuro ? "escuro" : "claro";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
